version: '3.9'

# Compose opcional para correr PostgreSQL + Redis localmente.
# Si no tenés Docker, podés arrancar el sistema en modo memoria
# (DATABASE_DRIVER=memory) sin nada externo.

services:
  postgres:
    image: postgres:15-alpine
    container_name: entrevistas-postgres
    environment:
      POSTGRES_DB: entrevistas
      POSTGRES_USER: entrevistas
      POSTGRES_PASSWORD: entrevistas
    ports:
      # Host 5433 para no colisionar con el Postgres de leia-core (5432).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrevistas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: entrevistas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
