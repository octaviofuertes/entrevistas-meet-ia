<header class="mb-8">
  <a routerLink="/puestos" class="text-sm text-primary-600 hover:underline">← Volver</a>
  <h1 class="text-3xl font-bold text-slate-900 mt-2">Nuevo puesto</h1>
  <p class="text-slate-600 mt-1">leIA estructura el stack, la seniority y las responsabilidades a evaluar.</p>
</header>

<form (submit)="onSubmit($event)" class="card space-y-6 max-w-2xl">

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="label">Título del puesto</label>
      <input class="input" required [(ngModel)]="title" name="title" />
    </div>
    <div>
      <label class="label">
        Empresa
        <a routerLink="/empresas/nueva" target="_blank" class="text-primary-600 text-xs hover:underline ml-1">+ Nueva</a>
      </label>
      <select class="input" [(ngModel)]="selectedCompanyId" name="selectedCompanyId">
        <option value="">— Sin empresa —</option>
        <option *ngFor="let c of companies" [value]="c.id">{{ c.name }}</option>
      </select>
    </div>
  </div>

  <div>
    <label class="label">Descripción</label>
    <textarea class="input" rows="3" required minlength="10" [(ngModel)]="description" name="description"></textarea>
  </div>

  <div>
    <label class="label">Conocimientos requeridos</label>
    <textarea class="input" rows="2" required
      placeholder="Ej: React, Node.js, PostgreSQL, testing"
      [(ngModel)]="knowledge" name="knowledge"></textarea>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="label">Ubicación</label>
      <input class="input" [(ngModel)]="location" name="location" />
    </div>
    <div>
      <label class="label">Salario</label>
      <input class="input" [(ngModel)]="salary" name="salary" />
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="label">Modalidad</label>
      <select class="input" [(ngModel)]="modality" name="modality">
        <option value="remoto">Remoto</option>
        <option value="hibrido">Híbrido</option>
        <option value="presencial">Presencial</option>
      </select>
    </div>
    <div>
      <label class="label">Fecha de publicación</label>
      <input class="input" type="date" [(ngModel)]="publishedAt" name="publishedAt" />
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="label">Vacantes</label>
      <input class="input" type="number" min="1" max="99" [(ngModel)]="vacancies" name="vacancies" />
    </div>
    <div>
      <label class="label">Estado</label>
      <select class="input" [(ngModel)]="hiringStatus" name="hiringStatus">
        <option value="abierto">Abierto</option>
        <option value="pausado">Pausado</option>
        <option value="cerrado">Cerrado</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="label">Duración objetivo</label>
      <select class="input" [(ngModel)]="duration" name="duration">
        <option [value]="10">10 minutos</option>
        <option [value]="15">15 minutos</option>
        <option [value]="20">20 minutos</option>
        <option [value]="30">30 minutos</option>
        <option [value]="45">45 minutos</option>
      </select>
    </div>
    <div>
      <label class="label">Tono</label>
      <select class="input" [(ngModel)]="tone" name="tone">
        <option value="cercano">Cercano</option>
        <option value="formal">Formal</option>
        <option value="tecnico">Técnico</option>
      </select>
    </div>
  </div>

  <div>
    <label class="label">Dimensiones a cubrir</label>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
      <label *ngFor="let d of allDimensions"
        class="flex items-center gap-2 p-2 rounded-lg border border-slate-200 hover:bg-slate-50 text-sm cursor-pointer">
        <input type="checkbox" [checked]="isDimSelected(d)" (change)="toggleDim(d)" />
        {{ dimensionLabels[d] }}
      </label>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" [(ngModel)]="report1" name="report1" />
      Generar Informe 1 (transcripción + resumen)
    </label>
    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" [(ngModel)]="report2" name="report2" />
      Generar Informe 2 (evaluación + scoring)
    </label>
  </div>

  <div *ngIf="error" class="p-3 bg-red-50 border border-red-200 rounded-lg text-red-800 text-sm">{{ error }}</div>

  <div class="flex gap-3">
    <button type="submit" class="btn-primary" [disabled]="busy">
      {{ busy ? 'Generando…' : 'Crear puesto' }}
    </button>
    <a routerLink="/puestos" class="btn-secondary">Cancelar</a>
  </div>
</form>
